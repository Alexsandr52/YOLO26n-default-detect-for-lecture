services:
  yolo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      IMAGE_WORKERS: ${IMAGE_WORKERS:-2}
      VIDEO_WORKERS: ${VIDEO_WORKERS:-1}
      MODEL_THREADS: ${MODEL_THREADS:-1}
      MAX_QUEUE: ${MAX_QUEUE:-60}
      RESULT_TTL_SECONDS: ${RESULT_TTL_SECONDS:-3600}
      COLAB_URL: ${COLAB_URL:-}
